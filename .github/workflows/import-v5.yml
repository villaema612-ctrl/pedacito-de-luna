name: Publicar version romantica v5

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Descargar HTML validado
        env:
          SOURCE_URL: "https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-3c98-820e-a13b-2b6cd4647245/raw?se=2026-09-20T22%3A23%3A52Z&sp=r&sv=2026-02-06&sr=b&scid=13f44662-27dd-5021-8376-47400f980c0a&skoid=86ad43b0-1afa-4d46-a6d6-9e67f7cdc5bc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-20T13%3A38%3A52Z&ske=2026-09-21T13%3A38%3A52Z&sks=b&skv=2026-02-06&sig=xPG3g5H4kPvfCrxWSiE98m8wnbmEAPeE6kZhRXpv9t0%3D"
        run: |
          curl --fail --location --retry 3 --retry-delay 2 "$SOURCE_URL" --output index.html.new
          echo "4edf0d34f5b9278dbc8a2814c308fd29910d233e0c0b5d7674f61d13f6a2141a  index.html.new" | sha256sum --check -
          test "$(stat -c%s index.html.new)" -eq 14376031
          mv index.html.new index.html

      - name: Guardar version final
        run: |
          rm -f .github/workflows/import-v5.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Pulir textos romanticos y entrada con musica"
          git push
