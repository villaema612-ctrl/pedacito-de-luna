name: Import final anniversary page

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  import-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download exact final HTML
        env:
          SOURCE_URL: "https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-49f0-820e-ace3-ee26638c44c6/raw?se=2026-09-20T04%3A02%3A57Z&sp=r&sv=2026-02-06&sr=b&scid=4e41ffeb-95bd-534b-817f-faac3c16698f&skoid=86ad43b0-1afa-4d46-a6d6-9e67f7cdc5bc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-19T12%3A25%3A47Z&ske=2026-09-20T12%3A25%3A47Z&sks=b&skv=2026-02-06&sig=1Z5HzurwxmswcP27tuvV5sxoZoN5O3hD4Npr9uvdnl4%3D"
        run: |
          curl --fail --location --retry 3 --retry-delay 2 "$SOURCE_URL" --output index.html
          echo "dcfd021bb2fbff360ec747f2682b8395b75aed20a5fd8e49a9de60d87a8c4b25  index.html" | sha256sum --check -
          test "$(stat -c%s index.html)" -eq 13361565

      - name: Commit verified site
        run: |
          rm -f .github/workflows/import-site.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish final anniversary page"
          git push
