name: Actualizar pagina aniversario v3

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Descargar HTML validado
        env:
          SOURCE_URL: "https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-6a0c-820e-8cb7-394b0937791d/raw?se=2026-09-20T21%3A42%3A17Z&sp=r&sv=2026-02-06&sr=b&scid=d8faea7b-efe5-569f-b718-5ae041341242&skoid=86ad43b0-1afa-4d46-a6d6-9e67f7cdc5bc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-20T13%3A03%3A51Z&ske=2026-09-21T13%3A03%3A51Z&sks=b&skv=2026-02-06&sig=fNsMNjvPVRNUqdfZIQe2ik4JHSZR5M%2Bh7Cs8fQxjYUA%3D"
        run: |
          curl --fail --location --retry 3 --retry-delay 2 "$SOURCE_URL" --output index.html.new
          echo "bff4b819cfe29fd5ba3e36c5fd0c0c9c8a1957cd97aec910192f8cd8aafc8919  index.html.new" | sha256sum --check -
          test "$(stat -c%s index.html.new)" -eq 14376295
          mv index.html.new index.html

      - name: Guardar version final
        run: |
          rm -f .github/workflows/import-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Mejorar musica en iPhone y recuerdo de Chiclayo"
          git push
