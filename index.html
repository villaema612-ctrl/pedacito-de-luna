<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#170b10">
<title>Para Cristal ♡</title>
<style>
html,body{margin:0;min-height:100%;background:#170b10;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
body{display:grid;place-items:center;min-height:100vh}
main{text-align:center;padding:32px;width:min(88vw,420px)}
.heart{font-size:44px;animation:pulse 1.2s ease-in-out infinite}
h1{font-family:Georgia,serif;font-weight:500;font-size:34px;margin:14px 0 8px}
p{opacity:.68;line-height:1.5}
.bar{height:4px;border-radius:99px;background:#3a2029;overflow:hidden;margin-top:22px}
.bar span{display:block;height:100%;width:0;background:#d68aa0;transition:width .2s}
small{display:block;margin-top:10px;opacity:.45}
@keyframes pulse{50%{transform:scale(1.08)}}
</style>
</head>
<body>
<main>
<div class="heart">♡</div>
<h1>Preparando tu sorpresa…</h1>
<p>Un momento. Estamos reuniendo todos sus recuerdos.</p>
<div class="bar"><span id="b"></span></div>
<small id="s">Cargando 0%</small>
</main>
<script>
(async()=>{
  const total=20, parts=[];
  try{
    for(let i=0;i<total;i++){
      const n=String(i).padStart(2,'0');
      const res=await fetch('parts/p'+n+'.txt?v=1',{cache:'no-store'});
      if(!res.ok) throw new Error('No se pudo cargar la parte '+n);
      parts.push(await res.text());
      const pct=Math.round(((i+1)/total)*100);
      document.getElementById('b').style.width=pct+'%';
      document.getElementById('s').textContent='Cargando '+pct+'%';
    }
    const html=parts.join('');
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    document.querySelector('h1').textContent='No pudimos abrir la sorpresa';
    document.querySelector('p').textContent='Recarga la página en unos segundos.';
    document.getElementById('s').textContent='';
  }
})();
</script>
</body>
</html>
